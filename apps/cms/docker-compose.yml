name: super-rotary-phone-cms

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${WORDPRESS_DB_NAME:-wordpress}
      MARIADB_USER: ${WORDPRESS_DB_USER:-wordpress}
      MARIADB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wordpress}
      MARIADB_ROOT_PASSWORD: ${WORDPRESS_DB_ROOT_PASSWORD:-root}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 10

  wordpress:
    image: wordpress:7.1.3-php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Subdirectory Multisite derives tenant URLs from the domain recorded in
    # wp_blogs, so the port is baked into the network at install time -- see
    # "Changing the port" in the README before overriding this.
    ports:
      - '${WORDPRESS_PORT:-8080}:80'
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wordpress}
      # Required before wp-cli can convert the install into a network.
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ALLOW_MULTISITE', true);
      # Comma-separated origins allowed to query /graphql from a browser.
      # See mu-plugins/headless-cors.php.
      CMS_GRAPHQL_ALLOWED_ORIGINS: ${CMS_GRAPHQL_ALLOWED_ORIGINS:-}
      # Where to ping when content changes, and the shared secret for it.
      # Both unset leaves mu-plugins/headless-revalidate.php dormant.
      CMS_REVALIDATE_URL: ${CMS_REVALIDATE_URL:-}
      CMS_REVALIDATE_SECRET: ${CMS_REVALIDATE_SECRET:-}
    volumes:
      - wp_data:/var/www/html
      # Must-use plugins auto-activate network-wide, for every tenant.
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins
      # Minimal block theme carrying the single "Default" template. Bind-mounted
      # so it lives in git rather than inside the wp_data volume, where a
      # `clean` would take it with the rest of the install.
      - ./theme:/var/www/html/wp-content/themes/srp-headless

  # One-shot initializer: installs core, builds the network, creates tenants and
  # network-activates WPGraphQL, then exits. Idempotent -- runs on every `up`.
  wp-cli:
    image: wordpress:cli-php8.3
    # Match the uid the wordpress (Debian) image owns files as, so wp-cli can
    # write to the shared wp_data volume (wp-content/upgrade, uploads, etc.).
    user: '33:33'
    depends_on:
      wordpress:
        condition: service_started
      db:
        condition: service_healthy
    environment:
      # uid 33 has no home dir in this image, so wp-cli can't create its cache
      # and warns on every plugin install. Point it somewhere writable.
      HOME: /tmp
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wordpress}
      # Keep in sync with the `wordpress` image tag above.
      WORDPRESS_CORE_VERSION: ${WORDPRESS_CORE_VERSION:-7.1.3}
      WORDPRESS_SITE_URL: ${WORDPRESS_SITE_URL:-http://localhost:8080}
      WORDPRESS_SITE_TITLE: ${WORDPRESS_SITE_TITLE:-Super Rotary Phone CMS}
      WORDPRESS_ADMIN_USER: ${WORDPRESS_ADMIN_USER:-admin}
      WORDPRESS_ADMIN_PASSWORD: ${WORDPRESS_ADMIN_PASSWORD:-admin}
      WORDPRESS_ADMIN_EMAIL: ${WORDPRESS_ADMIN_EMAIL:-admin@example.com}
      # Extra tenants beyond the primary site, as `slug:Title` pairs.
      WORDPRESS_TENANTS: ${WORDPRESS_TENANTS:-tenant-a:Tenant A,tenant-b:Tenant B}
      # So content changed from wp-cli pings the frontend too, not just edits
      # made in wp-admin. See mu-plugins/headless-revalidate.php.
      CMS_REVALIDATE_URL: ${CMS_REVALIDATE_URL:-}
      CMS_REVALIDATE_SECRET: ${CMS_REVALIDATE_SECRET:-}
    volumes:
      - wp_data:/var/www/html
      - ./scripts:/scripts:ro
      # So `wp rewrite flush` sees any rewrite rules the mu-plugins register.
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins
      # So `wp theme activate headless` can see the theme.
      - ./theme:/var/www/html/wp-content/themes/srp-headless
    entrypoint: ['bash', '/scripts/setup.sh']

volumes:
  db_data:
  wp_data:
